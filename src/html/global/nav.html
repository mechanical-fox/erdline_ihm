
<div class="banner">
    <div class="flex-line-align-top">
        <div class="nav-div-1">
            <p class="title">Erdline</p>
        </div>
        <div class="nav-div-2">
            <div  id="item-bar" class="flex-line">
                    @for(item of items(); track item){
                        @if(item == selected()){
                            <p class="item-activated" (click)="select(item)"> {{item}} </p>
                        }
                        @else{
                            <p class="item-desactivated" (click)="select(item)"> {{item}} </p>
                        }
                    }
            </div>
        </div>
    </div> 
</div>


@if(selected()=="Edition"){
    <Edition />
}
@if(selected()=="Tutoriel"){
    <Tutorial />
}
@if(selected()=="Exemples"){
    <Example />
}
@if(selected()=="A propos"){
    <About />
}
