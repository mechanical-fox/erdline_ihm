
@if(initialized()){
    <div class="messageBox-background">
        <div class="messageBox-div">
            <div class="messageBox-sub-div">
                <p class="messageBox-input-name">
                    Personnage
                </p>
                <select [(ngModel)]="newMessageCharacter" class="messageBox-select" (change)="characterChanged($event)">
                    <option value="empty"> -- Choix à effectuer -- </option>
                    <option value="narration"> Narration </option>
                    @for(character of characters; track character.id){
                        <option [value]="character.id">{{character.name}}</option>
                    }
                </select>
            </div>
            @if(newMessageCharacter() != "narration"){
                <div class="messageBox-sub-div">
                    <p class="messageBox-input-name">
                        Expression
                    </p>
                    <select [(ngModel)]="newMessageExpression" class="messageBox-select">
                        <option value="empty"> -- Choix à effectuer -- </option>

                        @for(expression of availableExpressions(); track expression.id){
                            <option [value]="expression.id">{{expression.name}}</option>    
                        }
                    </select>
                </div>
            }
        </div>

        <div class="messageBox-div">
            <div class="messageBox-sub-div">
                <p class="messageBox-input-name">
                    Message
                </p>
                <textarea [(ngModel)]="newMessageText" spellcheck="false" class="messageBox-textarea" rows="6" cols="50">  </textarea>
            </div>
        </div>
        <div class="messageBox-div-2">
            @if(indMessageToEdit() == -1){
                <button class="messageBox-button" (click)="validateMessage()"> Ajouter </button>
            }
            @else{
                <button class="messageBox-button" (click)="validateMessage()"> Modifier </button>
                <button class="messageBox-button" (click)="deleteMessage()"> Supprimer </button>
            }
        </div>

        @if(errorMessage() != null){
            <div class="messageBox-div-2">
                <p class="messageBox-error-message">{{errorMessage()}}</p>
            </div>
        }
        
    </div>
}
